name: Daily housekeeping agent

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    steps:
      - name: Run read-only production audit
        run: |
          curl --fail --retry 3 --retry-delay 10 --silent --show-error https://thepolka.cloud/health
          curl --fail --retry 3 --retry-delay 10 --silent --show-error https://thepolka.cloud/api/audit
      - name: Verify Agentforce catalog and downloads
        run: |
          curl --fail --silent --show-error --output /dev/null https://thepolka.cloud/agentforce
          curl --fail --silent --show-error --output /dev/null https://thepolka.cloud/agentforce/download/base
      - name: Verify Smart AI observatory
        run: |
          curl --fail --silent --show-error --output /dev/null https://thepolka.cloud/8
          curl --fail --silent --show-error https://thepolka.cloud/api/smart-ai/feed
