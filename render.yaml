services:
  - type: web
    name: thepolka-cloud
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python static/scripts/generate_stand.py
    startCommand: gunicorn --workers 2 --timeout 120 --access-logfile - --error-logfile - app:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_BASE
        sync: false
      - key: STRIPE_PRICE_SPELLCHECK
        sync: false
      - key: STRIPE_PRICE_CYBERSECURITY
        sync: false
      - key: STRIPE_PRICE_ADVERTISING
        sync: false
      - key: STRIPE_PRICE_SALES
        sync: false
      - key: STRIPE_PRICE_SOCIAL
        sync: false
      - key: STRIPE_PRICE_HOUSEKEEPING
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FAIRE_YOUTUBE_VIDEO_ID
        sync: false
      - key: STRIPE_PRICE_ILAW_CERTIFICATE
        sync: false
    disk:
      name: thepolka-data
      mountPath: /var/data
      sizeGB: 1
