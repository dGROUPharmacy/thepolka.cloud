services:
  - type: web
    name: thepolka-cloud
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python static/scripts/generate_stand.py
    startCommand: gunicorn --workers 2 --timeout 120 --access-logfile - --error-logfile - app:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: LINKEDIN_REFRESH_TOKEN
        sync: false
      - key: LINKEDIN_API_VERSION
        value: "202604"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: FAIRE_YOUTUBE_VIDEO_ID
        sync: false
      - key: STRIPE_PRICE_ILAW_CERTIFICATE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_INBOUND_TOKEN
        generateValue: true
      - key: MAIL_MX_VERIFIED
        value: "false"
      - key: SMTP_VERIFIED
        value: "false"
      - key: SPF_VERIFIED
        value: "false"
      - key: DKIM_VERIFIED
        value: "false"
      - key: DMARC_VERIFIED
        value: "false"
      - key: MAIL_INBOUND_VERIFIED
        value: "false"
    disk:
      name: thepolka-data
      mountPath: /var/data
      sizeGB: 1
