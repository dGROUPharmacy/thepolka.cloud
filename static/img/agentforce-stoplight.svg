  <circle cx="260" cy="635" r="137" fill="#70d879" opacity=".34" filter="url(#glow)"/>
  <circle cx="260" cy="635" r="112" fill="url(#green)" stroke="#244c36" stroke-width="12" filter="url(#glow)"/>
